name: Godot CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Direct cold start like Game Dev Hub
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee cold-start.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" cold-start.log; then
            echo "Direct Game Dev Hub style start contains an error."
            exit 1
          fi

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee import.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" import.log; then
            echo "Godot import log contains an error."
            exit 1
          fi

      - name: Load main scene
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee main-scene.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" main-scene.log; then
            echo "Main scene log contains an error."
            exit 1
          fi

      - name: Run gameplay input smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/input_smoke.tscn 2>&1 | tee input-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" input-smoke.log; then
            echo "Run gameplay input smoke test log contains an error."
            exit 1
          fi
          grep -q "INPUT_SMOKE: PASS" input-smoke.log

      - name: Run upgrade smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/upgrade_smoke.tscn 2>&1 | tee upgrade-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" upgrade-smoke.log; then
            echo "Run upgrade smoke test log contains an error."
            exit 1
          fi
          grep -q "UPGRADE_SMOKE: PASS" upgrade-smoke.log


      - name: Run core loop regression smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/core_loop_smoke.tscn 2>&1 | tee core-loop-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" core-loop-smoke.log; then
            echo "Run core loop regression smoke test log contains an error."
            exit 1
          fi
          grep -q "CORE_LOOP_SMOKE: PASS" core-loop-smoke.log


      - name: Run first automation smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/automation_smoke.tscn 2>&1 | tee automation-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" automation-smoke.log; then
            echo "Run first automation smoke test log contains an error."
            exit 1
          fi
          grep -q "AUTOMATION_SMOKE: PASS" automation-smoke.log

      - name: Run save model smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/save_model_smoke.tscn 2>&1 | tee save-model-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" save-model-smoke.log; then
            echo "Run save model smoke test log contains an error."
            exit 1
          fi
          grep -q "SAVE_MODEL_SMOKE: PASS" save-model-smoke.log

      - name: Run Foundation pilot smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/foundation_pilot_smoke.tscn 2>&1 | tee foundation-pilot-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" foundation-pilot-smoke.log; then
            echo "Foundation pilot smoke test log contains an error."
            exit 1
          fi
          grep -q "FOUNDATION_PILOT_SMOKE: PASS" foundation-pilot-smoke.log

      - name: Run Foundation save load smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 30s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/foundation_save_load_smoke.tscn 2>&1 | tee foundation-save-load-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" foundation-save-load-smoke.log; then
            echo "Foundation save load smoke test log contains an error."
            exit 1
          fi
          grep -q "FOUNDATION_SAVE_LOAD_SMOKE: PASS" foundation-save-load-smoke.log
